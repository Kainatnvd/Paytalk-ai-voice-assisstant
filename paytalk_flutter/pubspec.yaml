name: paytalk_flutter
description: A premium Flutter frontend for PayTalk AI Voice Assistant.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  material_symbols_icons: ^4.27.0
  animations: ^2.0.11
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.5.5
  record: ^6.2.0
  path_provider: ^2.1.5
  base64: ^1.0.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
